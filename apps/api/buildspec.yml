version: 0.2

phases:
    install:
        runtime-versions:
            nodejs: 22
        commands:
            - corepack enable
            - corepack prepare pnpm@10.14.0 --activate
            - pnpm install --frozen-lockfile
    pre_build:
        commands:
            - pnpm --filter @app/api... run lint
            - pnpm --filter @app/api... run typecheck
            - pnpm --filter @app/api... run test
    build:
        commands:
            - pnpm --filter @app/api... run build
            - mkdir -p api-bundle/dist
            - cp apps/api/dist/server.cjs api-bundle/dist/server.cjs
            - cp apps/api/Procfile api-bundle/Procfile
            - cp apps/api/deploy-package.json api-bundle/package.json
            - test ! -e api-bundle/.env

artifacts:
    base-directory: api-bundle
    files:
        - "**/*"

cache:
    paths:
        - "/root/.local/share/pnpm/store/**/*"
