version: 0.2

phases:
    install:
        runtime-versions:
            nodejs: 22
        commands:
            - corepack enable
            - corepack prepare pnpm@10.14.0 --activate
            - pnpm install --frozen-lockfile
    pre_build:
        commands:
            - pnpm --filter @app/web... run lint
            - pnpm --filter @app/web... run typecheck
            - pnpm --filter @app/web... run test
    build:
        commands:
            - pnpm --filter @app/web... run build
    post_build:
        commands:
            - aws s3 sync apps/web/dist/assets "s3://${FRONTEND_BUCKET}/assets" --cache-control "public,max-age=31536000,immutable"
            - aws s3 sync apps/web/dist "s3://${FRONTEND_BUCKET}" --delete --exclude "assets/*" --cache-control "no-cache"
            - aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/index.html" "/"

cache:
    paths:
        - "/root/.local/share/pnpm/store/**/*"
