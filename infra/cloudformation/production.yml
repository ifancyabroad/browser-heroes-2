AWSTemplateFormatVersion: "2010-09-09"
Description: Low-cost Browser Heroes 2 production infrastructure in eu-west-2.

Parameters:
    RepositoryId:
        Type: String
        Default: ifancyabroad/browser-heroes-2
    BranchName:
        Type: String
        Default: main
    CodeStarConnectionArn:
        Type: String
        Default: arn:aws:codestar-connections:eu-west-2:391673454505:connection/aca9cca0-a8a9-4378-9aaf-628695aeb7df
    ExistingDistributionId:
        Type: String
        Default: E1SBYI7G6KFV8U
    VpcId:
        Type: AWS::EC2::VPC::Id
        Default: vpc-0d675fa77a20c303c
    SubnetId:
        Type: AWS::EC2::Subnet::Id
        Default: subnet-07bcf4fd11cf06faa
    CloudFrontPrefixListId:
        Type: String
        Default: pl-93a247fa
    MongoUriSecretArn:
        Type: String
        Description: ARN of a Secrets Manager JSON secret containing the production MongoDB URI under MONGO_URI.
    SesFromEmail:
        Type: String
        Default: noreply@browserheroes.com
    PlatformArn:
        Type: String
        Default: arn:aws:elasticbeanstalk:eu-west-2::platform/Node.js 22 running on 64bit Amazon Linux 2023/6.11.5
    InstanceType:
        Type: String
        Default: t3.micro
Resources:
    FrontendBucket:
        Type: AWS::S3::Bucket
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Properties:
            BucketName: browser-heroes
            BucketEncryption:
                ServerSideEncryptionConfiguration:
                    - ServerSideEncryptionByDefault:
                          SSEAlgorithm: AES256
            OwnershipControls:
                Rules:
                    - ObjectOwnership: BucketOwnerEnforced
            PublicAccessBlockConfiguration:
                BlockPublicAcls: true
                BlockPublicPolicy: true
                IgnorePublicAcls: true
                RestrictPublicBuckets: true
            VersioningConfiguration:
                Status: Enabled
            LifecycleConfiguration:
                Rules:
                    - Id: ExpireOldFrontendVersions
                      Status: Enabled
                      NoncurrentVersionExpiration:
                          NoncurrentDays: 30

    FrontendOriginAccessControl:
        Type: AWS::CloudFront::OriginAccessControl
        Properties:
            OriginAccessControlConfig:
                Name: browser-heroes-frontend
                Description: Access from the existing browserheroes.com distribution.
                OriginAccessControlOriginType: s3
                SigningBehavior: always
                SigningProtocol: sigv4

    FrontendSpaFunction:
        Type: AWS::CloudFront::Function
        Properties:
            Name: browser-heroes-spa-routing
            AutoPublish: true
            FunctionCode: |
                function handler(event) {
                    var request = event.request;
                    var uri = request.uri;

                    if (uri.endsWith("/")) {
                        request.uri += "index.html";
                    } else if (!uri.includes(".")) {
                        request.uri = "/index.html";
                    }

                    return request;
                }
            FunctionConfig:
                Comment: Route Browser Heroes frontend paths to the SPA entry point.
                Runtime: cloudfront-js-2.0

    FrontendBucketPolicy:
        Type: AWS::S3::BucketPolicy
        Properties:
            Bucket: !Ref FrontendBucket
            PolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Sid: AllowCloudFrontRead
                      Effect: Allow
                      Principal:
                          Service: cloudfront.amazonaws.com
                      Action: s3:GetObject
                      Resource: !Sub "${FrontendBucket.Arn}/*"
                      Condition:
                          StringEquals:
                              AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${ExistingDistributionId}"

    ArtifactBucket:
        Type: AWS::S3::Bucket
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Properties:
            BucketEncryption:
                ServerSideEncryptionConfiguration:
                    - ServerSideEncryptionByDefault:
                          SSEAlgorithm: AES256
            PublicAccessBlockConfiguration:
                BlockPublicAcls: true
                BlockPublicPolicy: true
                IgnorePublicAcls: true
                RestrictPublicBuckets: true
            LifecycleConfiguration:
                Rules:
                    - Id: ExpirePipelineArtifacts
                      Status: Enabled
                      ExpirationInDays: 30

    SessionSecret:
        Type: AWS::SecretsManager::Secret
        Properties:
            Name: browser-heroes/production/session-secret
            Description: Express session signing secret for Browser Heroes 2 production.
            GenerateSecretString:
                PasswordLength: 64
                ExcludePunctuation: true

    ApiInstanceRole:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: ec2.amazonaws.com
                      Action: sts:AssumeRole
            ManagedPolicyArns:
                - arn:aws:iam::aws:policy/AWSElasticBeanstalkWebTier
            Policies:
                - PolicyName: BrowserHeroesRuntime
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Effect: Allow
                            Action: secretsmanager:GetSecretValue
                            Resource:
                                - !Ref SessionSecret
                                - !Ref MongoUriSecretArn
                          - Effect: Allow
                            Action:
                                - ses:SendEmail
                                - ses:SendRawEmail
                            Resource: !Sub "arn:${AWS::Partition}:ses:eu-west-1:${AWS::AccountId}:identity/browserheroes.com"

    ApiInstanceProfile:
        Type: AWS::IAM::InstanceProfile
        Properties:
            Roles:
                - !Ref ApiInstanceRole

    ApiSecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
            GroupDescription: Allow the Browser Heroes API only from CloudFront origins.
            VpcId: !Ref VpcId
            SecurityGroupIngress:
                - Description: HTTP from CloudFront origin-facing servers
                  IpProtocol: tcp
                  FromPort: 80
                  ToPort: 80
                  SourcePrefixListId: !Ref CloudFrontPrefixListId
            SecurityGroupEgress:
                - IpProtocol: -1
                  CidrIp: 0.0.0.0/0

    ApiApplication:
        Type: AWS::ElasticBeanstalk::Application
        Properties:
            ApplicationName: browser-heroes-api
            Description: Browser Heroes 2 API
            ResourceLifecycleConfig:
                ServiceRole: arn:aws:iam::391673454505:role/aws-elasticbeanstalk-service-role
                VersionLifecycleConfig:
                    MaxCountRule:
                        Enabled: true
                        DeleteSourceFromS3: true
                        MaxCount: 5

    ApiEnvironment:
        Type: AWS::ElasticBeanstalk::Environment
        Properties:
            ApplicationName: !Ref ApiApplication
            EnvironmentName: browser-heroes-api-production
            CNAMEPrefix: browser-heroes-api-production
            Description: Low-cost single-instance production API.
            PlatformArn: !Ref PlatformArn
            Tier:
                Name: WebServer
                Type: Standard
            OptionSettings:
                - Namespace: aws:elasticbeanstalk:environment
                  OptionName: EnvironmentType
                  Value: SingleInstance
                - Namespace: aws:elasticbeanstalk:environment
                  OptionName: ServiceRole
                  Value: aws-elasticbeanstalk-service-role
                - Namespace: aws:autoscaling:launchconfiguration
                  OptionName: InstanceType
                  Value: !Ref InstanceType
                - Namespace: aws:autoscaling:launchconfiguration
                  OptionName: IamInstanceProfile
                  Value: !Ref ApiInstanceProfile
                - Namespace: aws:autoscaling:launchconfiguration
                  OptionName: SecurityGroups
                  Value: !Ref ApiSecurityGroup
                - Namespace: aws:autoscaling:launchconfiguration
                  OptionName: DisableDefaultEC2SecurityGroup
                  Value: "true"
                - Namespace: aws:autoscaling:launchconfiguration
                  OptionName: RootVolumeType
                  Value: gp3
                - Namespace: aws:autoscaling:launchconfiguration
                  OptionName: RootVolumeSize
                  Value: "8"
                - Namespace: aws:ec2:vpc
                  OptionName: VPCId
                  Value: !Ref VpcId
                - Namespace: aws:ec2:vpc
                  OptionName: Subnets
                  Value: !Ref SubnetId
                - Namespace: aws:ec2:vpc
                  OptionName: AssociatePublicIpAddress
                  Value: "true"
                - Namespace: aws:elasticbeanstalk:application
                  OptionName: Application Healthcheck URL
                  Value: /api/health
                - Namespace: aws:elasticbeanstalk:healthreporting:system
                  OptionName: SystemType
                  Value: enhanced
                - Namespace: aws:elasticbeanstalk:command
                  OptionName: DeploymentPolicy
                  Value: AllAtOnce
                - Namespace: aws:elasticbeanstalk:application:environment
                  OptionName: NODE_ENV
                  Value: production
                - Namespace: aws:elasticbeanstalk:application:environment
                  OptionName: APP_URL
                  Value: https://browserheroes.com
                - Namespace: aws:elasticbeanstalk:application:environment
                  OptionName: TRUST_PROXY_HOPS
                  Value: "2"
                - Namespace: aws:elasticbeanstalk:application:environment
                  OptionName: SES_REGION
                  Value: eu-west-1
                - Namespace: aws:elasticbeanstalk:application:environment
                  OptionName: SES_FROM_EMAIL
                  Value: !Ref SesFromEmail
                - Namespace: aws:elasticbeanstalk:application:environment
                  OptionName: EMAIL_DELIVERY
                  Value: ses
                - Namespace: aws:elasticbeanstalk:application:environmentsecrets
                  OptionName: MONGO_URI
                  Value: !Sub "${MongoUriSecretArn}:MONGO_URI"
                - Namespace: aws:elasticbeanstalk:application:environmentsecrets
                  OptionName: SESSION_SECRET
                  Value: !Ref SessionSecret

    ApiBuildLogGroup:
        Type: AWS::Logs::LogGroup
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Properties:
            LogGroupName: /aws/codebuild/browser-heroes-api
            RetentionInDays: 14

    WebBuildLogGroup:
        Type: AWS::Logs::LogGroup
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Properties:
            LogGroupName: /aws/codebuild/browser-heroes-web
            RetentionInDays: 14

    BuildRole:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: codebuild.amazonaws.com
                      Action: sts:AssumeRole
            Policies:
                - PolicyName: BrowserHeroesBuild
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Effect: Allow
                            Action:
                                - logs:CreateLogStream
                                - logs:PutLogEvents
                            Resource:
                                - !GetAtt ApiBuildLogGroup.Arn
                                - !Sub "${ApiBuildLogGroup.Arn}:*"
                                - !GetAtt WebBuildLogGroup.Arn
                                - !Sub "${WebBuildLogGroup.Arn}:*"
                          - Effect: Allow
                            Action:
                                - s3:GetObject
                                - s3:GetObjectVersion
                                - s3:PutObject
                                - s3:GetBucketVersioning
                                - s3:ListBucket
                            Resource:
                                - !GetAtt ArtifactBucket.Arn
                                - !Sub "${ArtifactBucket.Arn}/*"
                          - Effect: Allow
                            Action:
                                - s3:GetObject
                                - s3:PutObject
                                - s3:DeleteObject
                                - s3:ListBucket
                            Resource:
                                - !GetAtt FrontendBucket.Arn
                                - !Sub "${FrontendBucket.Arn}/*"
                          - Effect: Allow
                            Action: cloudfront:CreateInvalidation
                            Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${ExistingDistributionId}"

    ApiBuildProject:
        Type: AWS::CodeBuild::Project
        Properties:
            Name: browser-heroes-api
            ServiceRole: !GetAtt BuildRole.Arn
            Artifacts:
                Type: CODEPIPELINE
            Source:
                Type: CODEPIPELINE
                BuildSpec: apps/api/buildspec.yml
            Environment:
                ComputeType: BUILD_GENERAL1_SMALL
                Image: aws/codebuild/standard:7.0
                Type: LINUX_CONTAINER
                PrivilegedMode: false
            LogsConfig:
                CloudWatchLogs:
                    Status: ENABLED
                    GroupName: !Ref ApiBuildLogGroup
            Cache:
                Type: S3
                Location: !Sub "${ArtifactBucket}/cache/api"

    WebBuildProject:
        Type: AWS::CodeBuild::Project
        Properties:
            Name: browser-heroes-web
            ServiceRole: !GetAtt BuildRole.Arn
            Artifacts:
                Type: CODEPIPELINE
            Source:
                Type: CODEPIPELINE
                BuildSpec: apps/web/buildspec.yml
            Environment:
                ComputeType: BUILD_GENERAL1_SMALL
                Image: aws/codebuild/standard:7.0
                Type: LINUX_CONTAINER
                PrivilegedMode: false
                EnvironmentVariables:
                    - Name: FRONTEND_BUCKET
                      Value: !Ref FrontendBucket
                    - Name: CLOUDFRONT_DISTRIBUTION_ID
                      Value: !Ref ExistingDistributionId
            LogsConfig:
                CloudWatchLogs:
                    Status: ENABLED
                    GroupName: !Ref WebBuildLogGroup
            Cache:
                Type: S3
                Location: !Sub "${ArtifactBucket}/cache/web"

    PipelineRole:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: codepipeline.amazonaws.com
                      Action: sts:AssumeRole
            Policies:
                - PolicyName: BrowserHeroesPipelines
                  PolicyDocument:
                      Version: "2012-10-17"
                      Statement:
                          - Effect: Allow
                            Action: codestar-connections:UseConnection
                            Resource: !Ref CodeStarConnectionArn
                          - Effect: Allow
                            Action:
                                - codebuild:StartBuild
                                - codebuild:BatchGetBuilds
                            Resource:
                                - !GetAtt ApiBuildProject.Arn
                                - !GetAtt WebBuildProject.Arn
                          - Effect: Allow
                            Action:
                                - s3:GetObject
                                - s3:GetObjectVersion
                                - s3:PutObject
                                - s3:GetBucketVersioning
                            Resource:
                                - !GetAtt ArtifactBucket.Arn
                                - !Sub "${ArtifactBucket.Arn}/*"
                          - Effect: Allow
                            # AWS's documented CodePipeline policy for the native
                            # Elastic Beanstalk deploy action spans these services.
                            Action:
                                - elasticbeanstalk:*
                                - ec2:*
                                - elasticloadbalancing:*
                                - autoscaling:*
                                - cloudwatch:*
                                - s3:*
                                - sns:*
                                - cloudformation:*
                                - rds:*
                                - sqs:*
                                - ecs:*
                            Resource: "*"

    ApiPipeline:
        Type: AWS::CodePipeline::Pipeline
        Properties:
            Name: browser-heroes-api
            RoleArn: !GetAtt PipelineRole.Arn
            ArtifactStore:
                Type: S3
                Location: !Ref ArtifactBucket
            Stages:
                - Name: Source
                  Actions:
                      - Name: Source
                        ActionTypeId:
                            Category: Source
                            Owner: AWS
                            Provider: CodeStarSourceConnection
                            Version: "1"
                        Configuration:
                            ConnectionArn: !Ref CodeStarConnectionArn
                            FullRepositoryId: !Ref RepositoryId
                            BranchName: !Ref BranchName
                            OutputArtifactFormat: CODE_ZIP
                            DetectChanges: "true"
                        OutputArtifacts:
                            - Name: SourceOutput
                        RunOrder: 1
                - Name: Build
                  Actions:
                      - Name: Build
                        ActionTypeId:
                            Category: Build
                            Owner: AWS
                            Provider: CodeBuild
                            Version: "1"
                        Configuration:
                            ProjectName: !Ref ApiBuildProject
                        InputArtifacts:
                            - Name: SourceOutput
                        OutputArtifacts:
                            - Name: ApiBundle
                        RunOrder: 1
                - Name: Deploy
                  Actions:
                      - Name: Deploy
                        ActionTypeId:
                            Category: Deploy
                            Owner: AWS
                            Provider: ElasticBeanstalk
                            Version: "1"
                        Configuration:
                            ApplicationName: !Ref ApiApplication
                            EnvironmentName: !Ref ApiEnvironment
                        InputArtifacts:
                            - Name: ApiBundle
                        RunOrder: 1

    WebPipeline:
        Type: AWS::CodePipeline::Pipeline
        Properties:
            Name: browser-heroes-web
            RoleArn: !GetAtt PipelineRole.Arn
            ArtifactStore:
                Type: S3
                Location: !Ref ArtifactBucket
            Stages:
                - Name: Source
                  Actions:
                      - Name: Source
                        ActionTypeId:
                            Category: Source
                            Owner: AWS
                            Provider: CodeStarSourceConnection
                            Version: "1"
                        Configuration:
                            ConnectionArn: !Ref CodeStarConnectionArn
                            FullRepositoryId: !Ref RepositoryId
                            BranchName: !Ref BranchName
                            OutputArtifactFormat: CODE_ZIP
                            DetectChanges: "true"
                        OutputArtifacts:
                            - Name: SourceOutput
                        RunOrder: 1
                - Name: BuildAndDeploy
                  Actions:
                      - Name: BuildAndDeploy
                        ActionTypeId:
                            Category: Build
                            Owner: AWS
                            Provider: CodeBuild
                            Version: "1"
                        Configuration:
                            ProjectName: !Ref WebBuildProject
                        InputArtifacts:
                            - Name: SourceOutput
                        RunOrder: 1

Outputs:
    FrontendBucketName:
        Value: !Ref FrontendBucket
    FrontendRegionalDomainName:
        Value: !GetAtt FrontendBucket.RegionalDomainName
    FrontendOriginAccessControlId:
        Value: !GetAtt FrontendOriginAccessControl.Id
    FrontendSpaFunctionArn:
        Value: !GetAtt FrontendSpaFunction.FunctionARN
    ApiEnvironmentName:
        Value: !Ref ApiEnvironment
    ApiOriginDomainName:
        Value: !GetAtt ApiEnvironment.EndpointURL
    SessionSecretArn:
        Value: !Ref SessionSecret
    ArtifactBucketName:
        Value: !Ref ArtifactBucket
